name: Deploy for distribution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tooltip.css'
      - 'tooltip.js'
      - '.github/workflows/distribute.yaml'
      - '.github/workflows/purge-cache.yaml'

permissions:
  contents: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build distribution files
        run: |
          npx --yes csso-cli@4.0.2 -i "tooltip.css" -o "tooltip.min.css" --comments first-exclamation
          npx --yes terser@5.51.2 "tooltip.js" -o "tooltip.min.js" -c -m --comments

      - name: Push to distribution branch
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git reset
          git add -f tooltip.min.css tooltip.min.js
          git commit -m "[bot] Build distribution files"
          git push --force origin dist
